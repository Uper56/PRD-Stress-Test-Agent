# Golden PRD manifest — used by the eval harness to align critique output
# against pre-labeled defects.
#
# Each defect has:
#   id         stable identifier within the PRD
#   severity   P0 | P1 | P2 (matches Critique severity)
#   dimension  metric_quality | dependency_identification |
#              internal_contradiction | risk_management | scope_ambiguity
#   note       short human description (the text inside the HTML comment)

prds:
  - file: prd_001_ai_support_widget.md
    title: "AI Support Widget"
    defect_count: 5
    defects:
      - id: D1
        severity: P0
        dimension: risk_management
        note: "No kill-switch / rollback / phased rollout."
      - id: D2
        severity: P0
        dimension: internal_contradiction
        note: "Solution forbids human escalation; UX includes a 'Talk to an agent' button."
      - id: D3
        severity: P2
        dimension: scope_ambiguity
        note: "'Supports all major languages' is undefined."
      - id: D4
        severity: P0
        dimension: metric_quality
        note: "40% deflection target without baseline, window, or definition."
      - id: D5
        severity: P1
        dimension: dependency_identification
        note: "LLM provider not listed; rate-limit, cost, PII unaddressed."

