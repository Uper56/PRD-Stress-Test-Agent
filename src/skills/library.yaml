- id: skl_001_api_dependency_enumeration
  name: API Dependency Enumeration
  description: Engineering critiques must check whether every third-party API (payments, auth, email, analytics, ML) is explicitly
    enumerated with a fallback plan, SLA expectation, and failure-mode handling.
  trigger_keywords:
  - api
  - endpoint
  - integration
  - third-party
  - webhook
  - sdk
  - stripe
  - twilio
  - oauth
  - openai
  trigger_semantic: PRD mentions any external API, SDK, webhook, or third-party service without enumerating dependencies,
    SLAs, or failure handling.
  injected_into:
