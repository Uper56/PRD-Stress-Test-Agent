- id: skl_002_quantified_metrics
  name: Quantified Metrics (Baseline / Target / Window)
  description: Every success metric must name (a) a current baseline, (b) a target value, and (c) a measurement window. Anything
    less is unmeasurable.
  trigger_keywords:
  - metric
  - kpi
  - success
  - deflect
  - reduce
  - increase
  - retention
  - conversion
  - adoption
  - north star
  trigger_semantic: PRD states a success metric, KPI, or target percentage without specifying baseline, target, and measurement
    window together.
  injected_into:
  - business
  prompt_fragment_path: fragments/skl_002_quantified_metrics.md
  confidence: 0.9
  usage_count: 0
  acceptance_rate: null
  created_at: '2026-04-24'
  created_by: seed
  learned_from_prds: []
  status: active
- id: skl_003_phased_rollout
  name: Phased Rollout / Gated Launch
  description: Any launch must define a rollout ladder (e.g. 1% → 10% → 50% → 100%) with rollback criteria and kill-switch
    ownership. Day-1 100% launches are a systems risk.
  trigger_keywords:
  - launch
  - rollout
  - ship
  - release
  - day 1
  - ga
  - 100%
  - all users
  - everyone
  trigger_semantic: PRD describes a launch, rollout, or release without naming a staged ramp, rollback criteria, or kill switch.
  injected_into:
  - engineering
